plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def requiredSigningKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def hasReleaseSigning = requiredSigningKeys.every {
    keystoreProperties[it]?.toString()?.trim()
}
def releaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}
if (releaseRequested && !hasReleaseSigning) {
    throw new GradleException(
        "Firma release ausente. Copia android/key.properties.example a " +
        "android/key.properties y configura el upload keystore."
    )
}

// App ID de AdMob. Solo del entorno: un ID real en el repositorio se filtra en
// cada clon. En debug se usa el de prueba oficial de Google, que no genera
// impresiones facturables.
def debugAdmobApplicationId = "ca-app-pub-3940256099942544~3347511713"
def admobApplicationId = System.getenv("ADMOB_APP_ID")?.trim()
if (releaseRequested && !admobApplicationId) {
    throw new GradleException(
        "ADMOB_APP_ID ausente. Exporta el App ID real de AdMob antes del build " +
        "release: sin el, la app arranca y muere con 'Missing application ID'."
    )
}
def resolvedAdmobApplicationId = admobApplicationId ?: debugAdmobApplicationId

android {
    namespace = "com.arcanum.magick"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId = "com.arcanum.magick"
        minSdkVersion = flutter.minSdkVersion
        targetSdkVersion = 36
        versionCode = flutter.versionCode.toInteger()
        versionName = flutter.versionName
        manifestPlaceholders["admobApplicationId"] = resolvedAdmobApplicationId
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.getByName("release")
            }
        }
    }
}

flutter {
    source = "../.."
}
