org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# OFFLINE MODE - Usa caché y mirrors locales, sin descargas de internet
org.gradle.offline=false
org.gradle.daemon=true
org.gradle.parallel=true

# Pub cache lives on C: while the project lives on D:. Kotlin incremental
# caches cannot relativize sources across drive roots on Windows.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
