name: arcanum_sigilos
description: "Taller de sigilos de ARCANUM: motor (letras, capas, estilo, escena, interaccion) y lienzo. Sin Firebase ni nada de la app: lo usan la app y las pruebas en movil."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # caminos SVG (d) -> Path del lienzo
  path_parsing: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
