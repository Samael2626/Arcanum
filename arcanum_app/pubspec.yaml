name: arcanum_app
description: "Práctica mágica, tarot, astrología y grimorio cifrado."
# The following prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.4+12

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  go_router: ^17.3.0
  dio: ^5.9.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  encrypt: ^5.0.3
  crypto: ^3.0.3
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  path_provider: ^2.1.6
  # rive: ^0.14.8
  # model_viewer_plus: ^1.10.0

  # Monetización
  purchases_flutter: ^10.11.0
  google_mobile_ads: ^9.0.0

  # Firebase. Crashlytics si, Analytics NO: estuvo aqui sin que ningun fichero de
  # lib/ lo importara, y en Android el SDK recoge por su cuenta con solo estar en
  # el classpath -- GeneratedPluginRegistrant lo registraba. Era analitica que
  # nadie miraba y que habia que declarar en Data Safety. Si algun dia se quiere,
  # se vuelve a anadir Y se declara.
  firebase_core: ^3.12.1
  firebase_crashlytics: ^4.3.1
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# the following section is specific to Flutter packages.

flutter:
  # The following ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/data/cities.txt
    - assets/data/cities.bin
    - assets/models/
    - assets/engravings/manifest.json
    - assets/engravings/hierbas/
    - assets/engravings/piedras/
    - assets/engravings/metales/
    - assets/engravings/inciensos/
    - assets/engravings/aceites/
    - assets/engravings/resinas/
    # Licencias de las fuentes: la OFL 1.1 obliga a distribuir su texto con el
    # software. Se empaquetan como asset y se registran en LicenseRegistry para
    # que aparezcan en showLicensePage().
    - assets/fonts/OFL-Libertinus.txt
    - assets/fonts/OFL-Noto.txt
    - assets/fonts/OFL-CormorantGaramond.txt
    - assets/fonts/OFL-CrimsonPro.txt
  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-600.ttf
          weight: 600
    - family: Crimson Pro
      fonts:
        - asset: assets/fonts/CrimsonPro-400.ttf
          weight: 400
        - asset: assets/fonts/CrimsonPro-400italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/CrimsonPro-500.ttf
          weight: 500
        - asset: assets/fonts/CrimsonPro-600.ttf
          weight: 600
    # Glifos: signos, planetas, nodos, aspectos y adornos. Ni Cormorant ni
    # Crimson traen uno solo -- comprobado leyendo su tabla cmap: 1 de los 39
    # que usa lib/. Sin esto la app se los pide al sistema y cada Android
    # decide; en varios salen como emoji de colores dentro de la rueda natal.
    #
    # Es UNA familia, no una cadena de fuentes. Ninguna fuente libre trae los
    # 39: la base es Libertinus Serif -- la unica serif del grupo, suya es la
    # rueda del zodiaco -- y los 15 que le faltan van injertados dentro, ya
    # escalados a su tamano. Medido: los cuatro origenes acaban con el mismo
    # alto medio, 689.
    #
    # La genera tool/generar_fuente_glifos.py, que ademas escribe el manifiesto
    # que vigila el test. Correrlo al estrenar un glifo nuevo; el test avisa.
    # SIL OFL 1.1: ver OFL-Libertinus.txt y OFL-Noto.txt al lado.
    - family: ArcanumGlifos
      fonts:
        - asset: assets/fonts/ArcanumGlifos-Regular.ttf
  # shaders:
  #   - shaders/nebula.frag
