version: 1

services:
  - type: web
    name: arcanum-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: standard

    # Todos los secretos se inyectan desde el dashboard de Render.
    # Nunca agregar credenciales o connection strings a este archivo.
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RUN_MIGRATIONS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:8080,https://arcanum-app-magick.web.app"
      - key: DEBUG
        value: "False"
      - key: GROQ_API_KEY
        sync: false

    healthCheckPath: /health
    healthCheckInterval: 30
    branch: feat/onboarding-5-pasos
    autoDeploy: true
