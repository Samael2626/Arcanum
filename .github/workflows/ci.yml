name: CI

# Hace real la regla "nunca commitear con tests rojos": hasta ahora los 79
# tests de Flutter y los 32 del backend solo corrían si alguien se acordaba.
on:
  push:
    branches: [main, master, develop, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

concurrency:
  # Un push nuevo cancela el run anterior de la misma rama.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Flutter (arcanum_app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arcanum_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formato
        # --set-exit-if-changed: el formato se verifica, no se corrige en CI.
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análisis estático
        run: flutter analyze

      - name: Tests
        run: flutter test

  api:
    name: Backend (arcanum-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arcanum-api

    services:
      # Los tests de integración necesitan PostgreSQL de verdad: los modelos
      # usan UUID, JSONB, ARRAY y gen_random_uuid(), que SQLite no crea.
      # Sin esta BD se saltarían (ver tests/conftest.py) y no probaríamos nada.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: arcanum_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Tests unitarios
        run: pytest tests_unit -q

      - name: Tests de integración
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/arcanum_test
          SECRET_KEY: ci-only-not-a-real-secret
        run: pytest tests -q

      # tests_pg cubre dinero y concurrencia (58 tests) contra el esquema que
      # produce Alembic (hasta la cabeza), no contra el de `create_all`. Necesita SU
      # PROPIA base: reutilizar arcanum_test mezclaría los dos esquemas, y
      # apuntar tests_pg a una base sin migrar da 58 errores de UndefinedTable
      # en vez de tests. Se crea con psycopg2 y no con psql para no depender de
      # que el runner traiga cliente de PostgreSQL.
      - name: Base con el esquema real de Alembic
        env:
          PGURL: postgresql://postgres:postgrespassword@localhost:5432/postgres
        run: |
          python - <<'PY'
          import os, psycopg2
          conexion = psycopg2.connect(os.environ["PGURL"])
          conexion.autocommit = True
          conexion.cursor().execute("CREATE DATABASE arcanum_migration_test")
          PY

      - name: Tests contra el esquema real (tests_pg)
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/arcanum_migration_test
          SECRET_KEY: ci-only-not-a-real-secret
        run: |
          python scripts/verify_migrations.py
          # -W error::pytest.PytestUnraisableExceptionWarning no: lo que importa
          # aqui es que NINGUNO se salte. Un salto significa base mal migrada, y
          # un verde con los 58 dormidos es justo el estado que este paso viene
          # a matar.
          pytest tests_pg -q -rs | tee /tmp/pg.log
          if grep -qE '[0-9]+ skipped' /tmp/pg.log; then
            echo "::error::tests_pg se salto tests — la base no esta migrada a la cabeza"
            exit 1
          fi
